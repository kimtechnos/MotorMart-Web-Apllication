name: Supabase keep-alive

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping keep_alive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query keep_alive over REST
        id: rest
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          SUPABASE_URL="$(printf '%s' "${SUPABASE_URL}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^["'\'']//;s/["'\'']$//')"
          SUPABASE_ANON_KEY="$(printf '%s' "${SUPABASE_ANON_KEY}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^["'\'']//;s/["'\'']$//')"
          export SUPABASE_URL SUPABASE_ANON_KEY
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing repository secrets. Set SUPABASE_URL and SUPABASE_ANON_KEY."
            exit 1
          fi

          eval "$(python3 <<'PY'
          import os, re
          from urllib.parse import urlparse

          raw_url = os.environ["SUPABASE_URL"].strip().strip("\"'")
          key = os.environ["SUPABASE_ANON_KEY"].strip().strip("\"'")
          if re.fullmatch(r"[a-z0-9]{20}", raw_url):
              raw_url = f"https://{raw_url}.supabase.co"
          parsed = urlparse(raw_url)
          if parsed.scheme not in ("https", "http") or not parsed.netloc:
              raise SystemExit("SUPABASE_URL must be https://<project-ref>.supabase.co")
          host = parsed.netloc.lower()
          if "pooler.supabase.com" in host or host.startswith("db.") or ":5432" in raw_url or raw_url.startswith("postgres"):
              raise SystemExit("SUPABASE_URL is the database host. Use https://<project-ref>.supabase.co from Settings → General.")
          base = f"{parsed.scheme}://{parsed.netloc}"
          if key.startswith("sb_secret_"):
              raise SystemExit("SUPABASE_ANON_KEY is a secret key. Use the publishable or legacy anon key.")
          if key.startswith("sb_publishable_"):
              kind = "publishable"
          elif key.startswith("eyJ"):
              kind = "legacy-jwt"
          else:
              kind = "unknown"
          print(f"BASE_URL={base}")
          print(f"KEY_KIND={kind}")
          PY
          )"

          echo "Requesting GET /rest/v1/keep_alive on host ${BASE_URL#https://}"
          echo "API key kind: ${KEY_KIND}"
          ENDPOINT="${BASE_URL}/rest/v1/keep_alive?select=id,last_ping&id=eq.1"

          AUTH_ARGS=(-H "apikey: ${SUPABASE_ANON_KEY}" -H "Accept: application/json")
          if [ "${KEY_KIND}" = "legacy-jwt" ]; then
            AUTH_ARGS+=(-H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          fi

          BODY="$(mktemp)"
          trap 'rm -f "${BODY}"' EXIT

          attempt=1
          max_attempts=3
          while [ "${attempt}" -le "${max_attempts}" ]; do
            echo "Attempt ${attempt} of ${max_attempts}"
            ERR="$(mktemp)"
            http_code="$(
              curl -4 -sS -o "${BODY}" -w "%{http_code}" \
                --max-time 20 \
                --connect-timeout 10 \
                "${AUTH_ARGS[@]}" \
                "${ENDPOINT}" \
                2>"${ERR}"
            )" || http_code="000"

            echo "HTTP ${http_code}"
            if [ -s "${ERR}" ]; then
              echo "curl error:"
              cat "${ERR}" || true
            fi
            rm -f "${ERR}"
            echo "Response body:"
            cat "${BODY}" || true
            echo

            if [ "${http_code}" = "200" ]; then
              if ! python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert isinstance(data, list) and data, "expected a non-empty JSON array"' "${BODY}"; then
                echo "Database responded 200 but keep_alive row 1 was missing."
                exit 1
              fi
              echo "Keep-alive succeeded over REST."
              exit 0
            fi

            if [ "${http_code}" = "400" ] || [ "${http_code}" = "401" ] || [ "${http_code}" = "403" ] || [ "${http_code}" = "404" ]; then
              echo "Keep-alive REST call failed with a client error."
              exit 1
            fi

            attempt=$((attempt + 1))
            if [ "${attempt}" -le "${max_attempts}" ]; then
              echo "PostgREST is not ready yet (often HTTP 503 / PGRST002). Waiting 10s."
              sleep 10
            fi
          done

          echo "REST keep-alive did not succeed. A SQL fallback can still ping the database."
          exit 1

      - name: Query keep_alive over SQL
        if: steps.rest.outcome != 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -eu
          if [ -z "${DATABASE_URL}" ]; then
            echo "REST keep-alive failed with PostgREST 503/PGRST002, and DATABASE_URL is not set."
            echo "Add a repository secret named DATABASE_URL with the same Postgres URI Render uses (session pooler, sslmode=require)."
            echo "Also check Supabase → Settings → Data API is enabled, then Restart project."
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

          CLEAN_URL="$(python3 <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse

          raw = os.environ["DATABASE_URL"].strip().strip("\"'")
          parsed = urlparse(raw)
          query = [(k, v) for k, v in parse_qsl(parsed.query, keep_blank_values=True) if k != "schema"]
          if not any(k == "sslmode" for k, _ in query):
              query.append(("sslmode", "require"))
          print(urlunparse(parsed._replace(query=urlencode(query))))
          PY
          )"

          echo "Running SELECT on public.keep_alive through the Postgres pooler."
          psql "$CLEAN_URL" -v ON_ERROR_STOP=1 -c "SELECT id, last_ping FROM public.keep_alive WHERE id = 1;"
          echo "Keep-alive succeeded over SQL."
