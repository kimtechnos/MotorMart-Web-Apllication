services:
  - type: web
    name: motormart-api
    runtime: node
    rootDir: Server
    buildCommand: npm install && npx prisma generate && node scripts/prisma-with-database-url.js migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
